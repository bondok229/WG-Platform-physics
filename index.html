<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wageh Al-Hussiny Platform</title>
    
    <!-- إعدادات تطبيق الويب للشاشة الرئيسية للأيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wageh Al-Hussiny Platform">
    
    <!-- الأيقونة المحلية -->
    <link rel="apple-touch-icon" href="logo_512x512.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000613;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            width: 100%;
        }

        .warning-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 25px;
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        h3 {
            color: #ffaa00;
            margin: 0 0 15px 0;
            font-size: 26px;
            font-weight: bold;
        }

        p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.8;
            margin: 0;
            max-width: 400px;
        }

        #box { display: none; }
    </style>
</head>
<body>

    <!-- رسالة الحظر للأندرويد والكمبيوتر -->
    <div class="container" id="box">
        <img src="logo_512x512.png" alt="Logo" class="warning-logo">
        <h3>منصة وجيه الحسيني</h3>
        <p>عذراً، هذه المنصة مخصصة لهواتف الأيفون (iOS) فقط ولا تعمل على الأندرويد أو أجهزة الكمبيوتر.</p>
    </div>

    <script>
        var realUrl = "https://wajih-al-husseini.tal5es.com";
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIos) {
            // توجيه فوري ونظيف للأيفون لضمان عرض المنصة بأبعادها الكاملة والصحيحة 100%
            window.location.replace(realUrl);
        } else {
            // إظهار رسالة الحظر لغير الأيفون
            document.getElementById('box').style.display = 'flex';
        }
    </script>
</body>
</html>
