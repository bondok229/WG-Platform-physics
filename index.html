<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Wageh Al-Hussiny Platform</title>
    
    <!-- إعدادات تطبيق الويب للشاشة الرئيسية للأيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wageh Al-Hussiny Platform">
    
    <!-- الأيقونة المحلية -->
    <link rel="apple-touch-icon" href="logo_512x512.png">

    <style>
      html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: #000613;
            overflow: hidden !important;
            position: fixed;
            top: 0;
            left: 0;
        }

        .frame-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000613;
            margin: 0;
            padding: 0;
        }

        #appFrame {
            width: 100vw;
            height: 100vh;
            /* بنكبر الإطار نسبة بسيطة ونحركه للسنتر عشان يغطي أي هَوامش نهائياً */
            transform: scale(1.02);
            transform-origin: center center;
            border: none;
            display: none;
            background-color: #000613;
        }
        /* رسالة الحظر للأندرويد والكمبيوتر */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            width: 100%;
            font-family: Tahoma, sans-serif;
        }

        .warning-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 25px;
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.25);
        }

        h3 { color: #ffaa00; margin: 0 0 15px 0; font-size: 24px; }
        p { color: #cccccc; font-size: 15px; line-height: 1.8; margin: 0; max-width: 400px; }
        #box { display: none; }
    </style>
</head>
<body>

    <!-- رسالة الحظر لغير الأيفون -->
    <div class="container" id="box">
        <img src="logo_512x512.png" alt="Logo" class="warning-logo">
        <h3>منصة وجيه الحسيني</h3>
        <p>عذراً، هذه المنصة مخصصة لهواتف الأيفون (iOS) فقط ولا تعمل على الأندرويد أو أجهزة الكمبيوتر.</p>
    </div>

    <!-- الإطار المتجاوب الخاص بعرض المنصة للأيفون -->
    <div class="frame-wrapper" id="frameWrapper" style="display:none;">
        <iframe id="appFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
    </div>

    <script>
        var realUrl = "https://wajih-al-husseini.tal5es.com";
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIos) {
            document.getElementById('frameWrapper').style.display = 'block';
            var frame = document.getElementById('appFrame');
            frame.style.display = 'block';
            frame.src = realUrl;
        } else {
            document.getElementById('box').style.display = 'flex';
        }
    </script>
</body>
</html>
