<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة وجيه الحسيني</title>
    <style>
        html, body, iframe {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
            background-color: #000613;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h3 { color: #ffaa00; margin-bottom: 10px; }
        p { color: #cccccc; font-size: 14px; }
    </style>
</head>
<body>

    <!-- محتوى الحظر (للأندرويد والكمبيوتر) -->
    <div class="container" id="box" style="display:none;">
        <h3>منصة وجيه الحسيني</h3>
        <p>عذراً، هذه المنصة مخصصة لهواتف الأيفون (iOS) فقط ولا تعمل على الأندرويد أو أجهزة الكمبيوتر.</p>
    </div>

    <!-- إطار خفي يعرض المنصة دون كشف الرابط الحقيقي للأيفون -->
    <iframe id="secretFrame" style="display:none;" src="" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        var realUrl = "https://wajih-al-husseini.tal5es.com";
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIos) {
            // لو أيفون: يتم عرض المنصة داخل الإطار الخفي، ويظل شريط البحث ثابتاً على رابطك أنت
            var iframe = document.getElementById('secretFrame');
            iframe.src = realUrl;
            iframe.style.display = 'block';
        } else {
            // لو أندرويد أو كمبيوتر: تظهر رسالة الحظر
            document.getElementById('box').style.display = 'flex';
        }
    </script>
</body>
</html>
