<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة وجيه الحسيني</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000613;
            overflow: hidden;
        }
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h3 { color: #ffaa00; margin-bottom: 10px; }
        p { color: #cccccc; font-size: 14px; }
    </style>
</head>
<body>

    <!-- رسالة الحظر للأندرويد والكمبيوتر -->
    <div class="container" id="box" style="display:none;">
        <h3>منصة وجيه الحسيني</h3>
        <p>عذراً، هذه المنصة مخصصة لهواتف الأيفون (iOS) فقط ولا تعمل على الأندرويد أو أجهزة الكمبيوتر.</p>
    </div>

    <!-- الإطار المعزول لإخفاء الرابط الحقيقي تماماً -->
    <iframe id="appFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

    <script>
        var realUrl = "https://wajih-al-husseini.tal5es.com";
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIos) {
            var frame = document.getElementById('appFrame');
            frame.style.display = 'block';
            
            // خداع متصفح الأيفون ليعمل كـ Sandbox مستقل تماماً مثل جوجل سايتس
            try {
                frame.src = realUrl;
            } catch (e) {
                window.location.href = realUrl;
            }
        } else {
            document.getElementById('box').style.display = 'flex';
        }
    </script>
</body>
</html>
